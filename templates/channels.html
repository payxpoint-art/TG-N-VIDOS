<!DOCTYPE html>
<html>
<head>
  <title>Telegram Backup Tool</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: Arial, sans-serif; max-width: 700px; margin: 30px auto; padding: 0 15px; }
    h2 { color: #2b6cb0; }
    ul { list-style: none; padding: 0; }
    li { background: #f4f6f8; margin-bottom: 10px; padding: 12px 15px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
    a.btn { background: #2b6cb0; color: white; border: none; padding: 6px 14px; border-radius: 5px; cursor: pointer; text-decoration: none; font-size: 14px; }
    a.btn:hover { background: #1e4e8c; }
  </style>
</head>
<body>
<h2>Apne Groups / Channels</h2>
<p>Jis channel ka backup lena hai uske aage "Select" dabao, uske baad destination channel choose karoge.</p>
<ul>
{% for d in dialogs %}
  <li>
    <strong>{{ d.name }}</strong>
    <a class="btn" href="/select-destination/{{ d.id }}">Select</a>
  </li>
{% endfor %}
</ul>
</body>
</html>

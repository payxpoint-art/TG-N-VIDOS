<!DOCTYPE html>
<html>
<head>
  <title>Telegram Backup Tool</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: Arial, sans-serif; max-width: 700px; margin: 30px auto; padding: 0 15px; }
    h2 { color: #2b6cb0; }
    ul { list-style: none; padding: 0; }
    li { background: #f4f6f8; margin-bottom: 10px; padding: 12px 15px; border-radius: 8px; }
    button { background: #2b6cb0; color: white; border: none; padding: 6px 14px; border-radius: 5px; cursor: pointer; margin-left: 10px; }
    button:hover { background: #1e4e8c; }
    .stats { display: block; margin-top: 6px; font-size: 14px; color: #333; }
  </style>
</head>
<body>
<h2>Apne Groups / Channels</h2>
<ul>
{% for d in dialogs %}
  <li>
    <strong>{{ d.name }}</strong>
    <button onclick="startBackup('{{ d.id }}')">Backup Start</button>
    <span class="stats" id="status-{{ d.id }}"></span>
  </li>
{% endfor %}
</ul>

<script>
async function startBackup(id) {
  await fetch(`/start-backup/${id}`, { method: "POST" });
  poll(id);
}

async function poll(id) {
  const res = await fetch(`/status/${id}`);
  const data = await res.json();
  document.getElementById(`status-${id}`).innerText =
    `Videos: ${data.total_videos||0} | Photos: ${data.total_photos||0} | Files: ${data.total_files||0} | Failed: ${data.total_failed||0} | Status: ${data.status||'not started'}`;
  if (data.status === "running") {
    setTimeout(() => poll(id), 3000);
  }
}
</script>
</body>
</html>
